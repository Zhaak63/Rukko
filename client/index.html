<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Arena FPS</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000}
#hit{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#f33;opacity:0;transition:opacity .15s}
#hp{position:fixed;left:20px;bottom:20px;font-size:34px;font-weight:800;text-shadow:0 2px 4px #000}
#ammo{position:fixed;right:20px;bottom:20px;font-size:34px;font-weight:800;text-shadow:0 2px 4px #000}
#time{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:800;text-shadow:0 2px 4px #000}
#board{position:fixed;top:12px;right:12px;background:#0007;padding:8px 12px;border-radius:8px;font-size:14px;min-width:150px}
#feed{position:fixed;top:12px;left:12px;font-size:14px;text-shadow:0 1px 3px #000}
#feed div{margin-bottom:4px;background:#0006;padding:3px 8px;border-radius:4px}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:800;background:#000a;cursor:pointer;white-space:pre-line}
#scope{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at center,transparent 0,transparent 30vmin,#000 30.3vmin)}
#dead{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800;white-space:pre-line;background:#5008;text-shadow:0 2px 6px #000;pointer-events:none}
#dmg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #f00;opacity:0;transition:opacity .3s}
</style></head><body>
<div id="cross"></div><div id="hit">✕</div><div id="dmg"></div><div id="scope"></div><div id="dead"></div>
<div id="hp">100</div><div id="ammo">12</div><div id="time">5:00</div>
<div id="board"></div><div id="feed"></div>
<div id="msg">Connexion…</div>
<script type="module" src="/src/main.js"></script>
</body></html>
